<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#161b22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#bc4dff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGradient)" />
  
  <!-- Grid pattern -->
  <g opacity="0.1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#58a6ff" stroke-width="1"/>
    </pattern>
    <rect width="1200" height="400" fill="url(#grid)" />
  </g>
  
  <!-- Code decoration -->
  <text x="30" y="40" font-family="monospace" font-size="14" fill="#30363d" opacity="0.6">def build_solutions():</text>
  <text x="920" y="40" font-family="monospace" font-size="14" fill="#30363d" opacity="0.6">while True: code()</text>
  <text x="30" y="370" font-family="monospace" font-size="14" fill="#30363d" opacity="0.6">return excellence</text>
  <text x="980" y="370" font-family="monospace" font-size="14" fill="#30363d" opacity="0.6">// Deploy to AWS</text>
  
  <!-- Main content -->
  <g transform="translate(600, 200)">
    <!-- Name -->
    <text x="0" y="-50" font-family="Arial, sans-serif" font-size="52" font-weight="bold" text-anchor="middle" fill="url(#textGradient)" filter="url(#glow)">
      Andrii Nepodymka
    </text>
    
    <!-- Title -->
    <text x="0" y="-5" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#c9d1d9">
      Full-Stack &amp; Trading Algorithms
    </text>
    
    <!-- Subtitle -->
    <text x="0" y="25" font-family="monospace" font-size="16" text-anchor="middle" fill="#8b949e">
      Python | FastAPI | Django | React | Next.js | AI/ML | Trading Automation
    </text>
    
    <!-- Skills badges -->
    <g transform="translate(-320, 55)">
      <!-- Python -->
      <rect x="0" y="0" width="80" height="32" rx="16" fill="#3776ab" opacity="0.9"/>
      <text x="40" y="21" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">Python</text>
      
      <!-- FastAPI -->
      <rect x="90" y="0" width="80" height="32" rx="16" fill="#009688" opacity="0.9"/>
      <text x="130" y="21" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">FastAPI</text>
      
      <!-- React -->
      <rect x="180" y="0" width="70" height="32" rx="16" fill="#61dafb" opacity="0.9"/>
      <text x="215" y="21" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#282c34">React</text>
      
      <!-- Node.js -->
      <rect x="260" y="0" width="75" height="32" rx="16" fill="#339933" opacity="0.9"/>
      <text x="297" y="21" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">Node.js</text>
      
      <!-- Docker -->
      <rect x="345" y="0" width="75" height="32" rx="16" fill="#2496ed" opacity="0.9"/>
      <text x="382" y="21" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">Docker</text>
      
      <!-- AWS -->
      <rect x="430" y="0" width="60" height="32" rx="16" fill="#ff9900" opacity="0.9"/>
      <text x="460" y="21" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">AWS</text>
      
      <!-- AI/ML -->
      <rect x="500" y="0" width="65" height="32" rx="16" fill="#bc4dff" opacity="0.9"/>
      <text x="532" y="21" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">AI/ML</text>
      
      <!-- Trading -->
      <rect x="575" y="0" width="75" height="32" rx="16" fill="#00d632" opacity="0.9"/>
      <text x="612" y="21" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">Trading</text>
    </g>
    
    <!-- Stats line -->
    <text x="0" y="115" font-family="monospace" font-size="15" text-anchor="middle" fill="#58a6ff">
      7+ years | 12 live bots | 3 ML models | 24/7 automation
    </text>
  </g>
  
  <!-- Icons -->
  <g opacity="0.3">
    <text x="60" y="200" font-size="36" fill="#58a6ff">🐍</text>
    <text x="1110" y="200" font-size="36" fill="#58a6ff">⚛️</text>
    <text x="60" y="260" font-size="36" fill="#58a6ff">📈</text>
    <text x="1110" y="260" font-size="36" fill="#58a6ff">🤖</text>
  </g>
</svg>