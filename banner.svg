<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#161b22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#bc4dff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bgGradient)" />
  
  <!-- Grid pattern -->
  <g opacity="0.1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#58a6ff" stroke-width="1"/>
    </pattern>
    <rect width="1200" height="300" fill="url(#grid)" />
  </g>
  
  <!-- Code decoration -->
  <text x="20" y="30" font-family="monospace" font-size="12" fill="#30363d" opacity="0.5">def build_solutions():</text>
  <text x="920" y="30" font-family="monospace" font-size="12" fill="#30363d" opacity="0.5">while True: code()</text>
  <text x="20" y="280" font-family="monospace" font-size="12" fill="#30363d" opacity="0.5">return excellence</text>
  <text x="980" y="280" font-family="monospace" font-size="12" fill="#30363d" opacity="0.5">// Deploy to AWS</text>
  
  <!-- Main content -->
  <g transform="translate(600, 150)">
    <!-- Name -->
    <text x="0" y="-40" font-family="Arial, sans-serif" font-size="42" font-weight="bold" text-anchor="middle" fill="url(#textGradient)" filter="url(#glow)">
      Andrii Nepodymka
    </text>
    
    <!-- Title -->
    <text x="0" y="-5" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#c9d1d9">
      Full-Stack &amp; Backend Engineer
    </text>
    
    <!-- Subtitle -->
    <text x="0" y="20" font-family="monospace" font-size="14" text-anchor="middle" fill="#8b949e">
      Python | FastAPI | Django | React | Next.js | AI/ML | Trading Automation
    </text>
    
    <!-- Skills badges -->
    <g transform="translate(-280, 45)">
      <!-- Python -->
      <rect x="0" y="0" width="70" height="28" rx="14" fill="#3776ab" opacity="0.9"/>
      <text x="35" y="19" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Python</text>
      
      <!-- FastAPI -->
      <rect x="80" y="0" width="70" height="28" rx="14" fill="#009688" opacity="0.9"/>
      <text x="115" y="19" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">FastAPI</text>
      
      <!-- React -->
      <rect x="160" y="0" width="60" height="28" rx="14" fill="#61dafb" opacity="0.9"/>
      <text x="190" y="19" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#282c34">React</text>
      
      <!-- Node.js -->
      <rect x="230" y="0" width="65" height="28" rx="14" fill="#339933" opacity="0.9"/>
      <text x="262" y="19" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Node.js</text>
      
      <!-- Docker -->
      <rect x="305" y="0" width="65" height="28" rx="14" fill="#2496ed" opacity="0.9"/>
      <text x="337" y="19" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Docker</text>
      
      <!-- AWS -->
      <rect x="380" y="0" width="50" height="28" rx="14" fill="#ff9900" opacity="0.9"/>
      <text x="405" y="19" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">AWS</text>
      
      <!-- AI/ML -->
      <rect x="440" y="0" width="55" height="28" rx="14" fill="#bc4dff" opacity="0.9"/>
      <text x="467" y="19" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">AI/ML</text>
      
      <!-- Trading -->
      <rect x="505" y="0" width="65" height="28" rx="14" fill="#00d632" opacity="0.9"/>
      <text x="537" y="19" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Trading</text>
    </g>
    
    <!-- Stats line -->
    <text x="0" y="95" font-family="monospace" font-size="13" text-anchor="middle" fill="#58a6ff">
      7+ years | 12 live bots | 3 ML models | 24/7 automation
    </text>
  </g>
  
  <!-- Icons -->
  <g opacity="0.3">
    <text x="50" y="150" font-size="30" fill="#58a6ff">🐍</text>
    <text x="1130" y="150" font-size="30" fill="#58a6ff">⚛️</text>
    <text x="50" y="200" font-size="30" fill="#58a6ff">📈</text>
    <text x="1130" y="200" font-size="30" fill="#58a6ff">🤖</text>
  </g>
</svg>